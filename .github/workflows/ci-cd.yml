name: CI/CD Pipeline

# Fluxo de branches:
#   feature/*  --PR-->  homolog  (deploy automático em HOMOLOGAÇÃO, namespace oficina-hml)
#   homolog    --PR-->  main     (deploy automático em PRODUÇÃO, namespace oficina-marimb0ndo)
# main e homolog são protegidas: só aceitam merge via PR com os checks verdes.

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_IMAGE: yaraduarte/oficina-marimb0ndo-api

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Executar testes
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # SonarQube efêmero: sobe o servidor como service container, analisa o código com a
  # cobertura do job de testes e falha o pipeline se o quality gate reprovar.
  quality:
    name: Qualidade (SonarQube)
    runs-on: ubuntu-latest
    needs: test
    services:
      sonarqube:
        image: sonarqube:10.7.0-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Aguardar SonarQube
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s http://localhost:9000/api/system/status | sed -E 's/.*"status":"([A-Z_]+)".*/\1/')
            [ "$status" = "UP" ] && echo "SonarQube UP" && exit 0
            echo "status=$status ($i/60)"; sleep 5
          done
          exit 1
      - name: Gerar token de análise
        id: token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-${GITHUB_RUN_ID}" -d "type=GLOBAL_ANALYSIS_TOKEN" | sed -E 's/.*"token":"([^"]+)".*/\1/')
          [ -n "$TOKEN" ] || { echo "falha ao gerar token"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Análise SonarQube (aguarda o quality gate)
        run: |
          docker run --rm --network host -v "$PWD:/usr/src" -w /usr/src \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN="${{ steps.token.outputs.token }}" \
            sonarsource/sonar-scanner-cli:11.1 \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
      - name: Resumo da qualidade
        if: always()
        run: |
          KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2)
          M=$(curl -s -u admin:admin \
            "http://localhost:9000/api/measures/component?component=${KEY}&metricKeys=alert_status,bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,security_hotspots,ncloc")
          echo "### SonarQube — ${KEY}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrica | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$M" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{for(const m of JSON.parse(s).component.measures)console.log('| '+m.metric+' | '+m.value+' |')}catch{console.log('| erro | sem métricas |')}})" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.event_name == 'push'

    outputs:
      # So a tag: o nome da imagem contem o DOCKER_USERNAME e o GitHub descarta outputs com valor de secret
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir tags da imagem
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=hml-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=${DOCKER_IMAGE}:hml-latest,${DOCKER_IMAGE}:hml-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}

  deploy-homolog:
    name: Deploy Homologação (k3s / oficina-hml)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/homolog'
    environment:
      name: homolog

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar manifesto e script para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ec2-user
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          source: "k8s/hml/app.yaml,scripts/deploy-hml.sh"
          target: /tmp/oficina-hml

      - name: Aplicar no namespace oficina-hml
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.tag }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ec2-user
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          envs: IMAGE,NEW_RELIC_LICENSE_KEY
          script: |
            bash /tmp/oficina-hml/scripts/deploy-hml.sh "$IMAGE" /tmp/oficina-hml/k8s/hml/app.yaml

  deploy-production:
    name: Deploy Produção (k3s / oficina-marimb0ndo)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.tag }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ec2-user
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          envs: IMAGE,NEW_RELIC_LICENSE_KEY
          script: |
            # New Relic: chave num Secret próprio, referenciada pelo deployment (criado pelo user_data da infra)
            if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then
              sudo kubectl create secret generic oficina-newrelic -n oficina-marimb0ndo \
                --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
                --dry-run=client -o yaml | sudo kubectl apply -f -
              if ! sudo kubectl get deployment oficina-api -n oficina-marimb0ndo \
                  -o jsonpath='{.spec.template.spec.containers[0].env[*].name}' | tr ' ' '\n' | grep -qx NEW_RELIC_LICENSE_KEY; then
                sudo kubectl patch deployment oficina-api -n oficina-marimb0ndo --type=json \
                  -p='[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"NEW_RELIC_LICENSE_KEY","valueFrom":{"secretKeyRef":{"name":"oficina-newrelic","key":"NEW_RELIC_LICENSE_KEY"}}}}]'
              fi
            fi
            sudo kubectl set image deployment/oficina-api \
              oficina-api="$IMAGE" \
              -n oficina-marimb0ndo
            sudo kubectl rollout status deployment/oficina-api \
              -n oficina-marimb0ndo --timeout=180s
