# Ambiente de HOMOLOGAÇÃO — aplicado pelo pipeline a cada push na branch homolog.
# Roda no mesmo k3s da produção, isolado no namespace oficina-hml,
# com banco próprio (oficina_db_hml) e porta NodePort própria (30081).
# __IMAGE__ é substituído pelo pipeline pela imagem hml-<sha>.
apiVersion: v1
kind: Namespace
metadata:
  name: oficina-hml
  labels:
    environment: homolog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina-hml
  labels:
    app: oficina-api
    environment: homolog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
        environment: homolog
    spec:
      containers:
        - name: oficina-api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api-service
  namespace: oficina-hml
spec:
  type: NodePort
  selector:
    app: oficina-api
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
